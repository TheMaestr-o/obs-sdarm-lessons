<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<title>Lower Third Overlay (native)</title>
	<!--
	Copyright (c) 2026 Maestro. MIT licence -- see /LICENSE at the repository root.

	This page builds the overlay markup itself, with ordinary DOM calls, and
	decides how what it is asked to show should ARRIVE: as an entrance, as a
	swap of one line on a plate that is already up, or -- for STOP -- as an
	exit. overlay.css has the motion; the choice between the three is made
	here, in show() and hide().

	It shared no code with the original lower-thirds script this project started
	from -- which did the same job with document.writeln() -- and that script has
	since been deleted from the repository. What it draws is not equally original
	in every part, and overlay.css says exactly where the line falls.
	-->
	<style>
		/*
		Background is true CSS transparent, not the original's solid black. This is a
		deliberate improvement over it (see LOCAL-SETUP.md for the reasoning): that
		page was meant to fill the FULL OBS canvas and relied on a Chroma Key filter
		(keying out black) for transparency. This page is only ever loaded as a small
		iframe inside result.html's bottom strip, never as a full-canvas Browser
		Source by itself -- so real alpha transparency via `background: transparent`
		is both possible and strictly better: no Chroma Key filter needed at all, no
		risk of keying out a dark colour that happens to appear in the lesson text,
		and it composites correctly over any OBS scene regardless of what's behind it.
		*/
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: transparent;
			overflow: hidden;
		}

		/*
		Bottom-anchored, 220px: the lower third of a 1080px canvas. result.html's
		iframe is taller than this on purpose -- a style may grow the strip upward
		for a question that runs to three lines (see overlay.css, style 1), and the
		room for that has to exist above it.
		*/
		#overlay-root {
			position: fixed;
			left: 0;
			bottom: 0;
			width: 100%;
			height: 220px;
			box-sizing: border-box;
			padding: 0 2em;
		}
	</style>
	<link rel="stylesheet" href="overlay.css">
</head>
<body>
	<div id="overlay-root"></div>

	<script>
		/*
		Two ways in, one renderer.

		URL parameters (id, line1, line2, ref, color1, color2, mode) -- read once at
		load. This is how the overlay has always been driven and it still works
		unchanged: result-wirecast.html points its iframe at a fresh URL on every
		Show, and a page loaded that way simply plays its entrance.

		postMessage from the parent ({channel, type:'show'|'hide', data}) -- how
		result.html drives it now. The page stays loaded between questions, which
		is what makes the two things a reload could never do possible: changing
		one line while the plate stays put, and leaving with an exit instead of
		vanishing. Messages, not reaching into the iframe: a file:// parent cannot
		touch a file:// iframe's document (see result.html), but it can always
		post to it.
		*/
		const CHANNEL = 'infor-r-overlay';

		// The plate's slant, as the design draws it: 26.5px of lean over 115.5px
		// of height. Multiplied by the plate's measured height to give the CSS the
		// one number it cannot derive itself -- see .ss-plate in overlay.css.
		const SLANT = 26.5 / 115.5;

		// How long each style's exit runs, plus a frame or two. After this the
		// markup is cleared and the parent is told it may hide the iframe.
		const EXIT_MS = { '1': 800, '2': 720, '3': 420 };
		// A changed line takes this long to clear before its replacement is put in.
		const SWAP_OUT_MS = 270;
		const RESIZE_MS = 360;

		const root = document.getElementById('overlay-root');

		let current = null;       // what is on air right now, or null
		let leaveTimer = null;    // running while an exit plays
		let swapTimer = null;     // running while a changed line clears
		let pendingFill = null;   // the text replacement that swap is waiting to do
		let plateObserver = null;

		function sanitizeHex(value, fallback) {
			const hex = (value || '').replace('#', '').trim();
			return /^[0-9a-fA-F]{6}$/.test(hex) ? hex : fallback;
		}

		function normalise(data) {
			const mode = data.mode === 'lesson' ? 'lesson' : 'question';
			const id = ['1', '2', '3'].includes(String(data.id)) ? String(data.id) : '1';
			return {
				id,
				mode,
				line1: (data.line1 || '').trim() || (mode === 'lesson' ? 'Lesson Title' : 'Section Title'),
				line2: (data.line2 || '').trim() || (mode === 'lesson' ? 'Memory verse' : 'Question text'),
				ref: (data.ref || '').trim(),
				color1: sanitizeHex(data.color1, 'ffffff'),
				color2: sanitizeHex(data.color2, 'c6a15b')
			};
		}

		// Small helper to build an element with class names and children in one go,
		// so the render functions below read close to the markup they produce.
		function el(tag, className, children) {
			const node = document.createElement(tag);
			if (className) node.className = className;
			(children || []).forEach((child) => node.appendChild(child));
			return node;
		}

		// The inner div is the thing that moves; the row around it is the mask.
		function inner(text, ref) {
			const node = document.createElement('div');
			node.textContent = text;
			if (ref) {
				node.appendChild(document.createTextNode(' '));
				const span = document.createElement('span');
				span.className = 'ref';
				span.textContent = ref;
				node.appendChild(span);
			}
			return node;
		}

		function row(className, key, text, ref) {
			const node = el('div', className, [inner(text, ref)]);
			node.dataset.row = key;
			return node;
		}

		function renderSlashSlide(s) {
			root.className = 'overlay-root style-slash-slide';
			root.appendChild(el('div', 'overlay-block', [
				// Behind the text, pinned to the block -- grows when the text does.
				el('div', 'ss-plate', [
					el('div', 'ss-wipe', [el('div', 'ss-fill', [])]),
					el('div', 'ss-stripe', [])
				]),
				row('ss-line ss-line1 color2 mask', 'line1', s.line1, ''),
				row('ss-line ss-line2 color1 mask', 'line2', s.line2, s.ref)
			]));
			watchPlate();
		}

		function renderSlideUpDown(s) {
			root.className = 'overlay-root style-slide-up-down';
			root.appendChild(el('div', 'overlay-block', [
				row('sud-block sud-line1 color2 mask', 'line1', s.line1, ''),
				row('sud-block sud-line2 color1 mask', 'line2', s.line2, s.ref)
			]));
		}

		/*
		"Quiet Rule" (id 3). Unlike the two above, this one does NOT wrap each
		line in a mask: it only fades and lifts each line a fraction of its own
		height in place, so there is nothing to clip. It has no swap either -- a
		change simply plays its (short) entrance again.
		*/
		function renderQuietRule(s) {
			root.className = 'overlay-root style-quiet-rule';
			root.appendChild(el('div', 'overlay-block', [
				el('div', 'qr-rule', []),
				el('div', 'qr-line1 color2 arimo', [inner(s.line1, '')]),
				el('div', 'qr-line2 color1', [inner(s.line2, s.ref)])
			]));
		}

		function applyColors(s) {
			root.style.setProperty('--line1-color', '#' + s.color1);
			root.style.setProperty('--line2-color', '#' + s.color2);
		}

		// Re-cuts the plate's slant whenever its height changes -- a font finishing
		// loading, a question wrapping, the block being resized during a swap. The
		// observer fires once a frame while the height is in motion, which is what
		// keeps the edge on the same line all the way through the transition.
		function watchPlate() {
			if (plateObserver) plateObserver.disconnect();
			const plate = root.querySelector('.ss-plate');
			if (!plate) return;
			const cut = () => plate.style.setProperty('--ss-slant', (plate.offsetHeight * SLANT).toFixed(2) + 'px');
			cut();
			plateObserver = new ResizeObserver(cut);
			plateObserver.observe(plate);
		}

		function clear() {
			if (plateObserver) { plateObserver.disconnect(); plateObserver = null; }
			root.replaceChildren();
			root.className = '';
			root.removeAttribute('style');
		}

		// Everything rebuilt from nothing, so every entrance starts clean.
		function renderFresh(s) {
			clear();
			applyColors(s);
			if (s.id === '2') renderSlideUpDown(s);
			else if (s.id === '3') renderQuietRule(s);
			else renderSlashSlide(s);
		}

		// Brings the DOM level with `current` at once: finishes a swap that is
		// still waiting to put its text in, drops every transitional class.
		function settle() {
			if (swapTimer) { clearTimeout(swapTimer); swapTimer = null; }
			if (pendingFill) { pendingFill(); pendingFill = null; }
			root.querySelectorAll('.is-out, .is-in').forEach((n) => n.classList.remove('is-out', 'is-in'));
			const block = root.querySelector('.overlay-block');
			if (block) { block.classList.remove('is-resizing'); block.style.height = ''; }
		}

		// Same style already on air: move only what changed.
		function swapRows(prev, next) {
			const changed = [];
			if (prev.line1 !== next.line1) changed.push('line1');
			if (prev.line2 !== next.line2 || prev.ref !== next.ref) changed.push('line2');
			if (changed.length === 0) return;   // the same question again -- it is already up

			const block = root.querySelector('.overlay-block');
			const rows = changed.map((key) => root.querySelector('[data-row="' + key + '"]'));
			rows.forEach((r) => r.classList.add('is-out'));

			pendingFill = () => {
				const before = block.offsetHeight;
				rows.forEach((r) => {
					const key = r.dataset.row;
					r.replaceChildren(inner(next[key], key === 'line2' ? next.ref : ''));
					r.classList.remove('is-out');
					r.classList.add('is-in');
				});
				// A different number of lines: walk the block from its old height to
				// its new one instead of letting it jump, and the plate -- pinned to
				// the block -- grows with it.
				const after = block.offsetHeight;
				if (after !== before) {
					block.style.height = before + 'px';
					void block.offsetHeight;
					block.classList.add('is-resizing');
					block.style.height = after + 'px';
					setTimeout(() => {
						block.classList.remove('is-resizing');
						block.style.height = '';
					}, RESIZE_MS);
				}
			};

			swapTimer = setTimeout(() => {
				swapTimer = null;
				const fill = pendingFill;
				pendingFill = null;
				if (fill) fill();
			}, SWAP_OUT_MS);
		}

		function show(data) {
			const next = normalise(data);

			// Pressed during an exit: the exit is abandoned and this becomes an
			// ordinary entrance.
			if (leaveTimer) {
				clearTimeout(leaveTimer);
				leaveTimer = null;
				current = null;
			}

			settle();

			const swappable = current && current.id === next.id && next.id !== '3';
			if (swappable) {
				applyColors(next);
				swapRows(current, next);
			} else {
				renderFresh(next);
			}
			current = next;
		}

		function hide() {
			if (!current) { notify('hidden'); return; }
			if (leaveTimer) return;
			settle();
			root.classList.add('is-leaving');
			leaveTimer = setTimeout(() => {
				leaveTimer = null;
				current = null;
				clear();
				notify('hidden');
			}, EXIT_MS[current.id] || 800);
		}

		function notify(type) {
			if (window.parent !== window) window.parent.postMessage({ channel: CHANNEL, type }, '*');
		}

		window.addEventListener('message', (event) => {
			// Only the page that embeds this one may drive it.
			if (event.source !== window.parent) return;
			const message = event.data;
			if (!message || message.channel !== CHANNEL) return;
			if (message.type === 'show' && message.data) show(message.data);
			else if (message.type === 'hide') hide();
		});

		const params = new URLSearchParams(window.location.search);
		if (params.has('line1') || params.has('line2')) {
			show({
				id: params.get('id'),
				mode: params.get('mode'),
				line1: params.get('line1'),
				line2: params.get('line2'),
				ref: params.get('ref'),
				color1: params.get('color1'),
				color2: params.get('color2')
			});
		}

		// Tells the parent that messages will be heard from here on. Until it has
		// seen this, result.html keeps using the URL to show things.
		notify('ready');
	</script>
</body>
</html>
