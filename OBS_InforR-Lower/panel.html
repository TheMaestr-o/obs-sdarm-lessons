<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<title>Lower Third Control Panel</title>
	<style>
		* {
			box-sizing: border-box;
		}

		/*
		Flat, dark, no gradients -- matches OBS's own dock panels (Audio Mixer,
		Loudness) rather than reading as a separate web app dropped into the
		window. One background color, one accent color (#4a9eff, close to OBS's
		own selection blue), plain borders instead of glow/blur, no text-fill
		gradients on headings. Changed on request after the original brighter
		blue/purple + green gradient look; the underlying markup/JS is untouched.
		*/
		body {
			margin: 0;
			font-family: -apple-system, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			/* #1D1F26 is OBS's own --bg_window value from its bundled Yami (dark)
			   theme (/Applications/OBS.app/Contents/Resources/themes/Yami.obt) --
			   matching it exactly instead of an approximate grey removes the
			   visible seam between the dock's real background and this page's,
			   which showed as a slightly-too-light/too-neutral rectangle floating
			   inside the actual dock. */
			background: #1D1F26;
			color: #d4d4d4;
			padding: 12px;
			min-height: 100vh;
		}

		/*
		No separate card background anymore -- the panel used to sit as its own
		#262626 rectangle inside the dock's own #1e1e1e background, which on a
		real OBS dock reads as a frame-within-a-frame (the dock's own edge, plus
		this panel's edge just inside it). Content now sits directly on the
		dock's background, full width, so it reads as part of the dock rather
		than a separate box floating inside it.
		*/
		.container {
			width: 100%;
		}

		.form-group {
			margin-bottom: 10px;
		}

		label {
			display: block;
			margin-bottom: 5px;
			font-weight: 400;
			color: #a0a0a0;
			font-size: 11px;
		}

		/* No border at rest -- the fields read by their own darker fill against
		   the panel background, not by an outline. A border only appears on
		   focus, as the one deliberate accent signal. */
		input[type="text"],
		textarea,
		select {
			width: 100%;
			padding: 7px 9px;
			/* #13141A = OBS's own --grey8, its darkest tone -- for a field that
			   should read as "recessed" relative to the #1D1F26 page background. */
			background: #13141A;
			border: 1px solid transparent;
			border-radius: 3px;
			color: #d4d4d4;
			font-size: 12.5px;
			font-family: inherit;
		}

		textarea {
			resize: vertical;
			min-height: 64px;
		}

		input:focus,
		select:focus,
		textarea:focus {
			outline: none;
			border-color: #4a9eff;
		}

		select option {
			/* #272A33 = OBS's own --grey6 -- one step lighter than the page
			   background, for a dropdown list that visibly sits on top of it. */
			background: #272A33;
			color: #d4d4d4;
		}

		.form-row {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
		}

		.color-row {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		input[type="color"] {
			width: 40px;
			height: 30px;
			padding: 2px;
			background: #13141A;
			border: none;
			border-radius: 3px;
			cursor: pointer;
		}

		.color-row input[type="text"] {
			flex: 1;
		}

		.template-options {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 6px;
		}

		/* No resting border on the cards -- only their fill (a shade lighter than
		   the panel) separates them, and the selected one is marked purely by a
		   solid accent fill instead of adding a border on top of a border. */
		.template-options label {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 6px;
			/* #272A33 = OBS's own --grey6, matching select option's fill above so
			   both read as "a step up" from the same #1D1F26 base consistently. */
			background: #272A33;
			border: none;
			border-radius: 4px;
			padding: 9px 7px 11px;
			cursor: pointer;
			margin: 0;
			text-align: center;
		}

		/* The whole card is a clickable <label>, and the selected state is already
		   shown by the card's own background fill below -- the native radio dot
		   is redundant on top of that and, unstyled, reads as a stray dot on the
		   card's edge. Visually hidden but still focusable/keyboard-operable
		   (not display:none, which would remove it from the tab order). */
		.template-options input[type="radio"] {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		.template-options label:has(input:checked) {
			background: #2c445e;
		}

		.template-options label:has(input:focus-visible) {
			outline: 2px solid #4a9eff;
			outline-offset: 1px;
		}

		.template-name {
			font-size: 11px;
			font-weight: 600;
			color: #d4d4d4;
		}

		/* Native <details>/<summary> for the collapsible style/colors section --
		   no JS needed, works identically in any browser/CEF. Styled to look like
		   part of the panel rather than a default browser widget. */
		.settings {
			margin-bottom: 10px;
		}

		.settings summary {
			cursor: pointer;
			font-size: 11px;
			color: #a0a0a0;
			padding: 4px 0;
			list-style: none;
		}

		.settings summary::-webkit-details-marker {
			display: none;
		}

		.settings summary::before {
			content: '\25B8';
			display: inline-block;
			margin-right: 5px;
			font-size: 9px;
			transition: transform 0.15s;
		}

		.settings[open] summary::before {
			transform: rotate(90deg);
		}

		/* Was `.settings .form-group:first-of-type`, which matches the first
		   .form-group under EVERY parent, not just the first one in .settings as
		   a whole -- so it also matched the Color 1 group (first child of
		   .form-row) but not Color 2 (second child), giving them different
		   top margins and knocking Color 1/Color 2 out of vertical alignment.
		   Target the actual first child of .settings directly instead. */
		.settings > .form-group:first-child {
			margin-top: 8px;
		}

		/* Tiny looping preview swatches: a simplified, isolated re-creation of each
		   animation's transform direction (not the real lower.css keyframes), just
		   enough to show "which way does it move" at a glance next to the text
		   description. Fully self-contained so it cannot collide with lower.css.

		   Defensive note: `opacity` on every animated element here is a plain,
		   constant `1` that is never touched by any @keyframes rule -- only
		   `transform` (and, for preview 5's frame, `clip-path`) moves during the
		   "entrance" phase. This means there is no point anywhere in the loop,
		   however/whenever a paint happens to sample it, where the element is
		   invisible: worst case if frozen mid-entrance it just sits slightly
		   offset from its settled position, which still reads as "a visible
		   swatch", not a blank box. This was a real bug, not a theoretical one:
		   these elements used to rely entirely on their @keyframes' 0% state
		   (opacity:0 / off-screen transform) as their ONLY source of visibility,
		   and when panel.html was opened inside OBS Studio's embedded Browser
		   Source (CEF) via right-click -> Interact, two of the three swatches
		   rendered nothing at all and the third showed only a static frame --
		   consistent with CEF applying an early animation frame once and then
		   never painting a later one, even though the exact same markup/CSS
		   animates correctly in a regular Chromium test. Two approaches were
		   tried and measured directly (via Playwright + getComputedStyle, freezing
		   the animation at many different elapsed times) before landing here:
		   simply adding a base `opacity:1` alongside the animation does NOT work
		   -- an attached CSS animation's keyframe values override the base value
		   for any property it touches, from the instant it's attached, so 0%
		   still wins. Making the @keyframes' 0% itself the settled state also
		   does NOT fully work -- if CEF's freeze lands even slightly *after* 0%
		   (measured: as little as ~50ms into a 2.4s loop), it can still land
		   inside the dip and go blank. Keeping opacity constant at 1 throughout
		   the whole animation (confirmed visible at every freeze point tested,
		   0ms-2000ms across the loop) is the only approach that has no invisible
		   window at all. will-change hints below are a secondary, defensive
		   addition for CEF's compositing, not the fix itself. Keep any future
		   edits here opacity-constant first, animated-transform second. */
		.template-preview {
			width: 100%;
			height: 28px;
			position: relative;
			overflow: hidden;
			background: #13141A;
			border-radius: 3px;
		}

		.template-preview .bar {
			position: absolute;
			left: 8%;
			width: 84%;
			height: 5px;
			border-radius: 2px;
			background: #c6a15b;
		}

		.template-preview .bar.alt {
			background: #ffffff;
		}

		/* Preview 1: diagonal slash fades in, two bars slide in from the left.
		   opacity stays a constant 1 (never animated); only transform moves
		   during the entrance -- see the defensive note above .template-preview. */
		.preview-1 .slash {
			top: 3px;
			height: 22px;
			width: 6px;
			left: 6%;
			background: linear-gradient(135deg, #c6a15b, #ffffff);
			opacity: 1;
			transform: skewX(-20deg) translateX(0);
			will-change: transform;
			animation: preview-1-slash 2.4s ease-in-out infinite;
		}
		.preview-1 .bar1 {
			top: 7px;
			opacity: 1;
			transform: translateX(0);
			will-change: transform;
			animation: preview-1-line 2.4s ease-in-out infinite;
		}
		.preview-1 .bar2 {
			top: 16px;
			opacity: 1;
			transform: translateX(0);
			will-change: transform;
			animation: preview-1-line 2.4s ease-in-out 0.15s infinite;
		}
		@keyframes preview-1-slash {
			0%, 10% { transform: skewX(-20deg) translateX(40px); }
			30%, 100% { transform: skewX(-20deg) translateX(0); }
		}
		@keyframes preview-1-line {
			0%, 14% { transform: translateX(-100%); }
			34%, 100% { transform: translateX(0); }
		}

		/* Preview 2: line 1 rises from below, line 2 drops from above. Same
		   constant-opacity approach as preview 1, see comment above. */
		.preview-2 .bar1 {
			top: 16px;
			opacity: 1;
			transform: translateY(0);
			will-change: transform;
			animation: preview-2-up 2.4s ease-out infinite;
		}
		.preview-2 .bar2 {
			top: 6px;
			opacity: 1;
			transform: translateY(0);
			will-change: transform;
			animation: preview-2-down 2.4s ease-out infinite;
		}
		@keyframes preview-2-up {
			0%, 10% { transform: translateY(18px); }
			30%, 100% { transform: translateY(0); }
		}
		@keyframes preview-2-down {
			0%, 10% { transform: translateY(-18px); }
			30%, 100% { transform: translateY(0); }
		}

		/* Preview 5: three frame edges draw in, then the two lines slide from
		   below/above -- simplified to a growing frame outline plus the two bars.
		   Same constant-opacity approach as previews 1/2, see comment above.
		   The frame's clip-path dip is also kept from ever fully closing (12%
		   inset short of 100%, not a full 100%), so the frame's outline stays at
		   least partly visible even if frozen mid-entrance, instead of vanishing
		   to a zero-size box. */
		.preview-5 .frame {
			top: 2px;
			left: 8%;
			width: 84%;
			height: 24px;
			background: none;
			border: 2px solid #c6a15b;
			border-radius: 2px;
			opacity: 1;
			clip-path: inset(0 0 0 0);
			will-change: clip-path;
			animation: preview-5-frame 2.4s ease-out infinite;
		}
		.preview-5 .bar1 {
			top: 8px;
			height: 4px;
			opacity: 1;
			transform: translateY(0);
			will-change: transform;
			animation: preview-5-text 2.4s ease-out 0.35s infinite;
		}
		.preview-5 .bar2 {
			top: 16px;
			height: 4px;
			opacity: 1;
			transform: translateY(0);
			will-change: transform;
			animation: preview-5-text 2.4s ease-out 0.5s infinite;
		}
		@keyframes preview-5-frame {
			0%, 8% { clip-path: inset(0 88% 88% 0); }
			28%, 100% { clip-path: inset(0 0 0 0); }
		}
		@keyframes preview-5-text {
			0%, 16% { transform: translateY(10px); }
			36%, 100% { transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			.template-preview * {
				animation: none !important;
			}
		}

		.btn-show {
			width: 100%;
			padding: 10px;
			margin-top: 4px;
			border: none;
			border-radius: 3px;
			font-size: 12.5px;
			font-weight: 600;
			letter-spacing: 0.4px;
			text-transform: uppercase;
			cursor: pointer;
			color: #ffffff;
			background: #4a9eff;
			transition: background 0.15s;
		}

		.btn-show:hover {
			background: #62aeff;
		}

		.status {
			margin-top: 8px;
			text-align: center;
			font-size: 11px;
			color: #7fc97f;
			min-height: 14px;
		}

		/*
		Lesson & Question picker -- unlike .settings (style/colors, set once and
		left alone), this section is used every single question during a live
		stream, so it stays open by default (<details open>) instead of
		collapsed, and sits above .settings in document order so it reads as
		the primary workflow, not a secondary option tucked below it.
		*/
		.lesson-picker {
			margin-bottom: 10px;
		}

		.lesson-picker summary {
			cursor: pointer;
			font-size: 11px;
			color: #a0a0a0;
			padding: 4px 0;
			list-style: none;
		}

		.lesson-picker summary::-webkit-details-marker {
			display: none;
		}

		.lesson-picker summary::before {
			content: '\25B8';
			display: inline-block;
			margin-right: 5px;
			font-size: 9px;
			transition: transform 0.15s;
		}

		.lesson-picker[open] summary::before {
			transform: rotate(90deg);
		}

		.lesson-picker > .form-group:first-child {
			margin-top: 8px;
		}

		/* Note shown instead of the picker UI when opened via file:// -- fetch()
		   of a relative local JSON path throws under file:// in Chromium (no
		   server to answer it), confirmed with Playwright against this exact
		   file before writing this fallback (see LOCAL-SETUP.md). Rather than
		   silently failing or leaving a console error the user never sees, the
		   picker UI is hidden and this note takes its place. */
		.lesson-picker-unavailable {
			font-size: 11.5px;
			color: #a0a0a0;
			background: #13141A;
			border-radius: 3px;
			padding: 9px 10px;
			line-height: 1.5;
		}

		/* Question rows -- similar spirit to .template-options' clickable cards
		   (a <button> per row, one accent fill for the "currently loaded" one)
		   but deliberately simpler: no preview swatch, just letter + text on
		   one line, since that's all a question row needs. */
		.question-list {
			display: flex;
			flex-direction: column;
			gap: 4px;
			max-height: 220px;
			overflow-y: auto;
		}

		.question-row {
			display: flex;
			gap: 7px;
			align-items: baseline;
			width: 100%;
			text-align: left;
			background: #272A33;
			border: none;
			border-radius: 3px;
			padding: 7px 9px;
			cursor: pointer;
			color: #d4d4d4;
			font-family: inherit;
			font-size: 12px;
		}

		.question-row:hover {
			background: #2e323d;
		}

		.question-row:focus-visible {
			outline: 2px solid #4a9eff;
			outline-offset: 1px;
		}

		/* The "currently loaded" question -- same accent fill used by the
		   selected template card in .settings, for a consistent "this is the
		   active one" signal across the panel. */
		.question-row.current {
			background: #2c445e;
		}

		.question-row .q-letter {
			flex: 0 0 auto;
			font-weight: 600;
			color: #c6a15b;
		}

		.question-row .q-text {
			flex: 1 1 auto;
		}

		.question-nav {
			display: flex;
			gap: 8px;
			margin-top: 8px;
		}

		/* Secondary buttons (Prev/Next) -- same flat shape as .btn-show but a
		   muted fill instead of the accent blue, so Show still reads as the
		   one primary action on the panel. */
		.btn-secondary {
			flex: 1 1 0;
			padding: 8px;
			border: none;
			border-radius: 3px;
			font-size: 12px;
			font-weight: 600;
			letter-spacing: 0.3px;
			cursor: pointer;
			color: #d4d4d4;
			background: #272A33;
			transition: background 0.15s;
		}

		.btn-secondary:hover:not(:disabled) {
			background: #323644;
		}

		.btn-secondary:disabled {
			opacity: 0.4;
			cursor: not-allowed;
		}

		.current-question-label {
			font-size: 11px;
			color: #a0a0a0;
			text-align: center;
			margin-top: 6px;
			min-height: 14px;
		}

	</style>
</head>
<body>
	<div class="container">
		<div class="panel">
			<div class="form-group">
				<label for="line1">Line 1</label>
				<input type="text" id="line1" placeholder="God's Love for Man" value="God's Love for Man">
			</div>

			<div class="form-group">
				<label for="line2">Line 2</label>
				<textarea id="line2" placeholder="a. What evidence of God's love is given to humanity?">a. What evidence of God's love is given to humanity?</textarea>
			</div>

			<!--
			Lesson & Question picker -- pulls language/lesson/question data from
			lessons-data.json (see tools/build-lessons-data.py) so the presenter
			can pick a lesson+language and click through its questions instead of
			typing Line 1/Line 2 by hand every time. Open by default (unlike
			.settings below): this is the thing actually used every question
			during a stream, while style/colors is set once and forgotten.
			Picking a question or pressing Next/Prev only fills Line 1/Line 2 as
			a starting point -- both fields stay plain, manually-editable text
			inputs from showBtn's point of view, same as if a human had typed
			into them.
			-->
			<details class="lesson-picker" id="lessonPicker" open>
				<summary>Lesson &amp; Question</summary>

				<div id="lessonPickerUnavailable" class="lesson-picker-unavailable" hidden>
					Lesson/question picker requires the http:// dock setup -- see
					LOCAL-SETUP.md.
				</div>

				<div id="lessonPickerUi">
					<div class="form-row">
						<div class="form-group">
							<label for="languageSelect">Language</label>
							<select id="languageSelect"></select>
						</div>
						<div class="form-group">
							<label for="lessonSelect">Lesson</label>
							<select id="lessonSelect"></select>
						</div>
					</div>

					<div class="form-group">
						<label>Questions</label>
						<div class="question-list" id="questionList"></div>
					</div>

					<div class="question-nav">
						<button type="button" class="btn-secondary" id="prevBtn">&larr; Previous</button>
						<button type="button" class="btn-secondary" id="nextBtn">Next &rarr;</button>
					</div>
					<div class="current-question-label" id="currentQuestionLabel"></div>
				</div>
			</details>

			<!--
			Style/colors are set once and rarely touched again, unlike line1/line2
			which change every question -- collapsed by default via a plain <details>
			(no JS needed, works the same in any browser/CEF) so the panel stays
			short for the thing actually used during a stream.
			-->
			<details class="settings">
				<summary>Style &amp; colors</summary>

				<div class="form-group">
					<!--
					Only id=1, id=2 and id=5 are offered here. id=3 overlaps line1/line2 when
					line2 is long, and id=4 does not render line2 at all -- both are unusable
					for a full lesson question, so they are intentionally left out of this
					panel. See LOCAL-SETUP.md for the full comparison table.
					-->
					<div class="template-options">
						<label>
							<input type="radio" name="template" value="1" checked>
							<span class="template-preview preview-1" aria-hidden="true">
								<span class="bar slash"></span>
								<span class="bar bar1"></span>
								<span class="bar alt bar2"></span>
							</span>
							<span class="template-name">Slash &amp; Slide</span>
						</label>
						<label>
							<input type="radio" name="template" value="2">
							<span class="template-preview preview-2" aria-hidden="true">
								<span class="bar bar1"></span>
								<span class="bar alt bar2"></span>
							</span>
							<span class="template-name">Slide Up / Down</span>
						</label>
						<label>
							<input type="radio" name="template" value="5">
							<span class="template-preview preview-5" aria-hidden="true">
								<span class="frame"></span>
								<span class="bar bar1"></span>
								<span class="bar alt bar2"></span>
							</span>
							<span class="template-name">Framed Reveal</span>
						</label>
					</div>
				</div>

				<div class="form-row">
					<div class="form-group">
						<label for="color1">Color 1</label>
						<div class="color-row">
							<input type="color" id="color1picker" value="#ffffff">
							<input type="text" id="color1" value="fff">
						</div>
					</div>
					<div class="form-group">
						<label for="color2">Color 2</label>
						<div class="color-row">
							<input type="color" id="color2picker" value="#c6a15b">
							<input type="text" id="color2" value="c6a15b">
						</div>
					</div>
				</div>
			</details>

			<button class="btn-show" id="showBtn">Show</button>
			<div class="status" id="status"></div>
		</div>
	</div>

	<script>
		const CHANNEL_NAME = 'infor-r-lower-thirds';
		const channel = new BroadcastChannel(CHANNEL_NAME);

		const line1El = document.getElementById('line1');
		const line2El = document.getElementById('line2');
		const color1El = document.getElementById('color1');
		const color2El = document.getElementById('color2');
		const color1PickerEl = document.getElementById('color1picker');
		const color2PickerEl = document.getElementById('color2picker');
		const statusEl = document.getElementById('status');

		// Keep the hex text input and the native color picker in sync in both directions.
		function syncPickerToText(picker, text) {
			picker.addEventListener('input', () => {
				text.value = picker.value.replace('#', '');
			});
		}
		function syncTextToPicker(text, picker) {
			text.addEventListener('input', () => {
				const hex = text.value.replace('#', '').trim();
				if (/^[0-9a-fA-F]{6}$/.test(hex)) {
					picker.value = '#' + hex;
				}
			});
		}
		syncPickerToText(color1PickerEl, color1El);
		syncPickerToText(color2PickerEl, color2El);
		syncTextToPicker(color1El, color1PickerEl);
		syncTextToPicker(color2El, color2PickerEl);

		function sanitizeHex(value, fallback) {
			const hex = (value || '').replace('#', '').trim();
			return /^[0-9a-fA-F]{6}$/.test(hex) ? hex : fallback;
		}

		// localStorage key used as a fallback handoff channel -- see the big comment
		// block below the BroadcastChannel line at the top of this script for why
		// this exists alongside BroadcastChannel rather than replacing it.
		const STORAGE_KEY = 'infor-r-lower-thirds-state';

		document.getElementById('showBtn').addEventListener('click', () => {
			const templateEl = document.querySelector('input[name="template"]:checked');
			const data = {
				id: templateEl ? templateEl.value : '1',
				line1: line1El.value,
				line2: line2El.value,
				color1: sanitizeHex(color1El.value, 'fff'),
				color2: sanitizeHex(color2El.value, 'c6a15b'),
				_t: Date.now() // lets result.html tell two identical presses apart
			};

			// Primary channel: works when panel.html and result.html are both Browser
			// Sources/Interact windows inside the SAME OBS scene-source CEF context
			// (the originally-documented "Control scene + Interact" setup).
			channel.postMessage(data);

			// Fallback channel: BroadcastChannel does NOT cross from a Custom Browser
			// DOCK (View/Docks -> Custom Browser Docks) to a scene's Browser Source,
			// even though both are "inside OBS" -- confirmed live: dock UI works fine,
			// but Show never reached result.html. Docks appear to run in a separate
			// CEF request context from scene sources, so BroadcastChannel/localStorage
			// under file:// don't share state across that boundary either.
			//
			// localStorage works here ONLY if this page is loaded over http://, not
			// file:// (both need the same origin, and file:// origins don't share
			// storage the way a real host:port does) -- see LOCAL-SETUP.md, "Custom
			// Browser Dock setup" for how to serve this folder over http:// for that
			// reason. Writing is a no-op error under file:// in most engines, so this
			// is wrapped defensively rather than assumed to always succeed.
			try {
				localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
			} catch (e) {
				// file:// origin, or storage disabled -- BroadcastChannel-only is fine
				// for the Interact-based setup, so this is silently ignored.
			}

			statusEl.textContent = 'Sent to result.html at ' + new Date().toLocaleTimeString();
			setTimeout(() => { statusEl.textContent = ''; }, 4000);
		});

		// --- Lesson & Question picker -----------------------------------------
		// Reads lessons-data.json (built by tools/build-lessons-data.py) and lets
		// the presenter pick a language + lesson, click a question to fill
		// Line 1/Line 2, and step through that lesson's questions with
		// Next/Previous. This never touches showBtn's click handler above or
		// adds any BroadcastChannel/localStorage traffic of its own -- it only
		// ever writes into line1El.value / line2El.value, exactly as if a human
		// had typed into those fields by hand. Line 1/Line 2 stay fully
		// editable afterwards; nothing here locks them to mirror the picker.
		(function () {
			const unavailableEl = document.getElementById('lessonPickerUnavailable');
			const uiEl = document.getElementById('lessonPickerUi');
			const languageSelectEl = document.getElementById('languageSelect');
			const lessonSelectEl = document.getElementById('lessonSelect');
			const questionListEl = document.getElementById('questionList');
			const prevBtn = document.getElementById('prevBtn');
			const nextBtn = document.getElementById('nextBtn');
			const currentQuestionLabelEl = document.getElementById('currentQuestionLabel');

			// fetch() of a relative local file throws under file:// in Chromium
			// (confirmed with Playwright against this exact file: "Fetch API
			// cannot load file://... URL scheme 'file' is not supported") -- no
			// server means there's nothing to answer the request, so the picker
			// can't work there at all. Detect this up front from location.protocol
			// rather than waiting for fetch() to fail, so the UI never flashes
			// before hiding itself.
			if (location.protocol === 'file:') {
				document.getElementById('lessonPicker').querySelector('summary').textContent = 'Lesson & Question (unavailable)';
				uiEl.hidden = true;
				unavailableEl.hidden = false;
				return;
			}

			let bundle = null;          // the full parsed lessons-data.json
			let currentLang = null;     // e.g. "ru"
			let currentLessonNo = null; // e.g. "1" (string, matches the JSON's "no")
			let currentQuestionIndex = null; // index into the current lesson's questions[], or null if nothing loaded yet

			function getLangData(lang) {
				return bundle.languages[lang];
			}

			function getLesson(lang, lessonNo) {
				const lessons = getLangData(lang).lessons;
				return lessons.find((l) => String(l.no) === String(lessonNo)) || null;
			}

			function populateLanguageSelect() {
				const langs = Object.keys(bundle.languages).sort();
				languageSelectEl.innerHTML = '';
				for (const lang of langs) {
					const opt = document.createElement('option');
					opt.value = lang;
					opt.textContent = lang.toUpperCase();
					languageSelectEl.appendChild(opt);
				}
				// Default to ru if present (the base language used throughout this
				// project's lesson content), else whatever sorts first.
				currentLang = langs.includes('ru') ? 'ru' : langs[0];
				languageSelectEl.value = currentLang;
			}

			function populateLessonSelect(preserveLessonNo) {
				const lessons = getLangData(currentLang).lessons;
				lessonSelectEl.innerHTML = '';
				for (const lesson of lessons) {
					const opt = document.createElement('option');
					opt.value = lesson.no;
					opt.textContent = lesson.no + '. ' + lesson.title;
					lessonSelectEl.appendChild(opt);
				}
				// Preserve the same lesson NUMBER across a language switch when
				// possible (smoother if the presenter is mid-question and just
				// wants the same lesson in a different language), else fall back
				// to the first lesson in the list.
				const stillExists = preserveLessonNo != null && lessons.some((l) => String(l.no) === String(preserveLessonNo));
				currentLessonNo = stillExists ? preserveLessonNo : lessons[0].no;
				lessonSelectEl.value = currentLessonNo;
			}

			function renderQuestionList() {
				const lesson = getLesson(currentLang, currentLessonNo);
				questionListEl.innerHTML = '';
				lesson.questions.forEach((q, idx) => {
					const row = document.createElement('button');
					row.type = 'button';
					row.className = 'question-row';
					if (idx === currentQuestionIndex) row.classList.add('current');

					const letterSpan = document.createElement('span');
					letterSpan.className = 'q-letter';
					letterSpan.textContent = q.letter + '.';

					const textSpan = document.createElement('span');
					textSpan.className = 'q-text';
					textSpan.textContent = q.text;

					row.appendChild(letterSpan);
					row.appendChild(textSpan);
					row.addEventListener('click', () => loadQuestion(idx));
					questionListEl.appendChild(row);
				});
				updateNav();
			}

			// Fills Line 1/Line 2 the same way for a list click or a Next/Prev
			// press, and marks the given index as the "currently loaded" one.
			function loadQuestion(idx) {
				const lesson = getLesson(currentLang, currentLessonNo);
				const q = lesson.questions[idx];
				if (!q) return;

				currentQuestionIndex = idx;
				line1El.value = lesson.title;
				line2El.value = q.letter + '. ' + q.text;

				let currentRow = null;
				questionListEl.querySelectorAll('.question-row').forEach((row, rowIdx) => {
					const isCurrent = rowIdx === idx;
					row.classList.toggle('current', isCurrent);
					if (isCurrent) currentRow = row;
				});
				// Next/Previous can walk the "current" row outside the question
				// list's scrollable viewport (max-height: 220px) -- keep it in
				// view so the presenter can always see which question is loaded.
				if (currentRow) currentRow.scrollIntoView({ block: 'nearest' });
				updateNav();
			}

			function updateNav() {
				const lesson = getLesson(currentLang, currentLessonNo);
				const total = lesson.questions.length;
				const hasCurrent = currentQuestionIndex != null;

				prevBtn.disabled = !hasCurrent || currentQuestionIndex <= 0;
				nextBtn.disabled = !hasCurrent || currentQuestionIndex >= total - 1;

				if (hasCurrent) {
					const q = lesson.questions[currentQuestionIndex];
					currentQuestionLabelEl.textContent = 'Question ' + q.letter + ' (' + (currentQuestionIndex + 1) + ' of ' + total + ')';
				} else {
					currentQuestionLabelEl.textContent = total > 0 ? 'Click a question below to load it' : 'No questions found for this lesson';
				}
			}

			prevBtn.addEventListener('click', () => {
				if (currentQuestionIndex != null && currentQuestionIndex > 0) {
					loadQuestion(currentQuestionIndex - 1);
				}
			});

			nextBtn.addEventListener('click', () => {
				const lesson = getLesson(currentLang, currentLessonNo);
				if (currentQuestionIndex != null && currentQuestionIndex < lesson.questions.length - 1) {
					loadQuestion(currentQuestionIndex + 1);
				}
			});

			languageSelectEl.addEventListener('change', () => {
				currentLang = languageSelectEl.value;
				populateLessonSelect(currentLessonNo);
				currentQuestionIndex = null;
				renderQuestionList();
			});

			lessonSelectEl.addEventListener('change', () => {
				currentLessonNo = lessonSelectEl.value;
				currentQuestionIndex = null;
				renderQuestionList();
			});

			fetch('lessons-data.json')
				.then((res) => {
					if (!res.ok) throw new Error('HTTP ' + res.status);
					return res.json();
				})
				.then((data) => {
					bundle = data;
					populateLanguageSelect();
					populateLessonSelect(null);
					renderQuestionList();
				})
				.catch((err) => {
					// Belt-and-suspenders: the file:// case is already handled above
					// before this fetch ever runs, but a real http:// setup could
					// still fail to fetch this file for other reasons (server not
					// running, file missing/moved, malformed JSON). Same graceful
					// degradation as the file:// case rather than a silent failure.
					document.getElementById('lessonPicker').querySelector('summary').textContent = 'Lesson & Question (unavailable)';
					uiEl.hidden = true;
					unavailableEl.hidden = false;
					unavailableEl.textContent = 'Lesson/question picker could not load lessons-data.json (' + err.message + ') -- see LOCAL-SETUP.md.';
				});
		})();
	</script>
</body>
</html>
