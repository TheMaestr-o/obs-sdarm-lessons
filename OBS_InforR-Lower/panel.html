<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<title>Lower Third Control Panel</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
			color: #ffffff;
			padding: 20px;
			min-height: 100vh;
		}

		.container {
			max-width: 640px;
			margin: 0 auto;
		}

		h1 {
			text-align: center;
			margin: 0 0 4px;
			font-size: 22px;
			background: linear-gradient(135deg, #3b82f6, #9333ea);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
		}

		.subtitle {
			text-align: center;
			color: #9ca3af;
			font-size: 12px;
			margin-bottom: 20px;
		}

		.panel {
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 8px;
			padding: 16px;
		}

		.form-group {
			margin-bottom: 14px;
		}

		label {
			display: block;
			margin-bottom: 5px;
			font-weight: 500;
			color: #e0e0e0;
			font-size: 12px;
		}

		input[type="text"],
		textarea,
		select {
			width: 100%;
			padding: 8px 10px;
			background: rgba(255, 255, 255, 0.1);
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 4px;
			color: #ffffff;
			font-size: 13px;
			font-family: inherit;
		}

		textarea {
			resize: vertical;
			min-height: 70px;
		}

		input:focus,
		select:focus,
		textarea:focus {
			outline: none;
			border-color: #3b82f6;
			background: rgba(255, 255, 255, 0.15);
		}

		select option {
			background: #2d2d2d;
			color: #ffffff;
		}

		.form-row {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
		}

		.color-row {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		input[type="color"] {
			width: 44px;
			height: 34px;
			padding: 2px;
			background: rgba(255, 255, 255, 0.1);
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 4px;
			cursor: pointer;
		}

		.color-row input[type="text"] {
			flex: 1;
		}

		.template-options {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 8px;
		}

		.template-options label {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 6px;
			background: rgba(255, 255, 255, 0.06);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 6px;
			padding: 10px 8px 12px;
			cursor: pointer;
			margin: 0;
			text-align: center;
		}

		.template-options input[type="radio"] {
			margin: 0;
		}

		.template-options label:has(input:checked) {
			border-color: #3b82f6;
			background: rgba(59, 130, 246, 0.2);
		}

		.template-name {
			font-size: 12px;
			font-weight: 700;
			color: #ffffff;
		}

		.template-desc {
			font-size: 10.5px;
			font-weight: 400;
			color: #9ca3af;
			line-height: 1.35;
		}

		/* Tiny looping preview swatches: a simplified, isolated re-creation of each
		   animation's transform direction (not the real lower.css keyframes), just
		   enough to show "which way does it move" at a glance next to the text
		   description. Fully self-contained so it cannot collide with lower.css.

		   Defensive note: `opacity` on every animated element here is a plain,
		   constant `1` that is never touched by any @keyframes rule -- only
		   `transform` (and, for preview 5's frame, `clip-path`) moves during the
		   "entrance" phase. This means there is no point anywhere in the loop,
		   however/whenever a paint happens to sample it, where the element is
		   invisible: worst case if frozen mid-entrance it just sits slightly
		   offset from its settled position, which still reads as "a visible
		   swatch", not a blank box. This was a real bug, not a theoretical one:
		   these elements used to rely entirely on their @keyframes' 0% state
		   (opacity:0 / off-screen transform) as their ONLY source of visibility,
		   and when panel.html was opened inside OBS Studio's embedded Browser
		   Source (CEF) via right-click -> Interact, two of the three swatches
		   rendered nothing at all and the third showed only a static frame --
		   consistent with CEF applying an early animation frame once and then
		   never painting a later one, even though the exact same markup/CSS
		   animates correctly in a regular Chromium test. Two approaches were
		   tried and measured directly (via Playwright + getComputedStyle, freezing
		   the animation at many different elapsed times) before landing here:
		   simply adding a base `opacity:1` alongside the animation does NOT work
		   -- an attached CSS animation's keyframe values override the base value
		   for any property it touches, from the instant it's attached, so 0%
		   still wins. Making the @keyframes' 0% itself the settled state also
		   does NOT fully work -- if CEF's freeze lands even slightly *after* 0%
		   (measured: as little as ~50ms into a 2.4s loop), it can still land
		   inside the dip and go blank. Keeping opacity constant at 1 throughout
		   the whole animation (confirmed visible at every freeze point tested,
		   0ms-2000ms across the loop) is the only approach that has no invisible
		   window at all. will-change hints below are a secondary, defensive
		   addition for CEF's compositing, not the fix itself. Keep any future
		   edits here opacity-constant first, animated-transform second. */
		.template-preview {
			width: 100%;
			height: 28px;
			position: relative;
			overflow: hidden;
			background: rgba(0, 0, 0, 0.35);
			border-radius: 3px;
		}

		.template-preview .bar {
			position: absolute;
			left: 8%;
			width: 84%;
			height: 5px;
			border-radius: 2px;
			background: #c6a15b;
		}

		.template-preview .bar.alt {
			background: #ffffff;
		}

		/* Preview 1: diagonal slash fades in, two bars slide in from the left.
		   opacity stays a constant 1 (never animated); only transform moves
		   during the entrance -- see the defensive note above .template-preview. */
		.preview-1 .slash {
			top: 3px;
			height: 22px;
			width: 6px;
			left: 6%;
			background: linear-gradient(135deg, #c6a15b, #ffffff);
			opacity: 1;
			transform: skewX(-20deg) translateX(0);
			will-change: transform;
			animation: preview-1-slash 2.4s ease-in-out infinite;
		}
		.preview-1 .bar1 {
			top: 7px;
			opacity: 1;
			transform: translateX(0);
			will-change: transform;
			animation: preview-1-line 2.4s ease-in-out infinite;
		}
		.preview-1 .bar2 {
			top: 16px;
			opacity: 1;
			transform: translateX(0);
			will-change: transform;
			animation: preview-1-line 2.4s ease-in-out 0.15s infinite;
		}
		@keyframes preview-1-slash {
			0%, 10% { transform: skewX(-20deg) translateX(40px); }
			30%, 100% { transform: skewX(-20deg) translateX(0); }
		}
		@keyframes preview-1-line {
			0%, 14% { transform: translateX(-100%); }
			34%, 100% { transform: translateX(0); }
		}

		/* Preview 2: line 1 rises from below, line 2 drops from above. Same
		   constant-opacity approach as preview 1, see comment above. */
		.preview-2 .bar1 {
			top: 16px;
			opacity: 1;
			transform: translateY(0);
			will-change: transform;
			animation: preview-2-up 2.4s ease-out infinite;
		}
		.preview-2 .bar2 {
			top: 6px;
			opacity: 1;
			transform: translateY(0);
			will-change: transform;
			animation: preview-2-down 2.4s ease-out infinite;
		}
		@keyframes preview-2-up {
			0%, 10% { transform: translateY(18px); }
			30%, 100% { transform: translateY(0); }
		}
		@keyframes preview-2-down {
			0%, 10% { transform: translateY(-18px); }
			30%, 100% { transform: translateY(0); }
		}

		/* Preview 5: three frame edges draw in, then the two lines slide from
		   below/above -- simplified to a growing frame outline plus the two bars.
		   Same constant-opacity approach as previews 1/2, see comment above.
		   The frame's clip-path dip is also kept from ever fully closing (12%
		   inset short of 100%, not a full 100%), so the frame's outline stays at
		   least partly visible even if frozen mid-entrance, instead of vanishing
		   to a zero-size box. */
		.preview-5 .frame {
			top: 2px;
			left: 8%;
			width: 84%;
			height: 24px;
			background: none;
			border: 2px solid #c6a15b;
			border-radius: 2px;
			opacity: 1;
			clip-path: inset(0 0 0 0);
			will-change: clip-path;
			animation: preview-5-frame 2.4s ease-out infinite;
		}
		.preview-5 .bar1 {
			top: 8px;
			height: 4px;
			opacity: 1;
			transform: translateY(0);
			will-change: transform;
			animation: preview-5-text 2.4s ease-out 0.35s infinite;
		}
		.preview-5 .bar2 {
			top: 16px;
			height: 4px;
			opacity: 1;
			transform: translateY(0);
			will-change: transform;
			animation: preview-5-text 2.4s ease-out 0.5s infinite;
		}
		@keyframes preview-5-frame {
			0%, 8% { clip-path: inset(0 88% 88% 0); }
			28%, 100% { clip-path: inset(0 0 0 0); }
		}
		@keyframes preview-5-text {
			0%, 16% { transform: translateY(10px); }
			36%, 100% { transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			.template-preview * {
				animation: none !important;
			}
		}

		.btn-show {
			width: 100%;
			padding: 12px;
			margin-top: 6px;
			border: none;
			border-radius: 6px;
			font-size: 14px;
			font-weight: 700;
			letter-spacing: 0.5px;
			text-transform: uppercase;
			cursor: pointer;
			color: white;
			background: linear-gradient(135deg, #10b981, #059669);
			transition: opacity 0.2s;
		}

		.btn-show:hover {
			opacity: 0.9;
		}

		.status {
			margin-top: 10px;
			text-align: center;
			font-size: 12px;
			color: #10b981;
			min-height: 16px;
		}

		.hint {
			font-size: 11px;
			color: #9ca3af;
			margin-top: 4px;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>Lower Third Control Panel</h1>
		<div class="subtitle">Plan 3 &mdash; drives result.html over BroadcastChannel</div>

		<div class="panel">
			<div class="form-group">
				<label for="line1">Line 1 (lesson topic, e.g. "God's Love for Man")</label>
				<input type="text" id="line1" placeholder="God's Love for Man" value="God's Love for Man">
			</div>

			<div class="form-group">
				<label for="line2">Line 2 (letter + question, e.g. "a. What evidence...")</label>
				<textarea id="line2" placeholder="a. What evidence of God's love is given to humanity?">a. What evidence of God's love is given to humanity?</textarea>
			</div>

			<div class="form-group">
				<label>Template</label>
				<!--
				Only id=1, id=2 and id=5 are offered here. id=3 overlaps line1/line2 when
				line2 is long, and id=4 does not render line2 at all -- both are unusable
				for a full lesson question, so they are intentionally left out of this
				panel. See LOCAL-SETUP.md for the full comparison table.
				-->
				<div class="template-options">
					<label>
						<input type="radio" name="template" value="1" checked>
						<span class="template-preview preview-1" aria-hidden="true">
							<span class="bar slash"></span>
							<span class="bar bar1"></span>
							<span class="bar alt bar2"></span>
						</span>
						<span class="template-name">Slash &amp; Slide</span>
						<span class="template-desc">Diagonal accent slash fades in, both lines slide in from the left</span>
					</label>
					<label>
						<input type="radio" name="template" value="2">
						<span class="template-preview preview-2" aria-hidden="true">
							<span class="bar bar1"></span>
							<span class="bar alt bar2"></span>
						</span>
						<span class="template-name">Slide Up / Down</span>
						<span class="template-desc">Line 1 rises from below, line 2 drops from above</span>
					</label>
					<label>
						<input type="radio" name="template" value="5">
						<span class="template-preview preview-5" aria-hidden="true">
							<span class="frame"></span>
							<span class="bar bar1"></span>
							<span class="bar alt bar2"></span>
						</span>
						<span class="template-name">Framed Reveal</span>
						<span class="template-desc">An animated frame draws itself in, then both lines slide in from below/above</span>
					</label>
				</div>
			</div>

			<div class="form-row">
				<div class="form-group">
					<label for="color1">Color 1 (line1 / main text)</label>
					<div class="color-row">
						<input type="color" id="color1picker" value="#ffffff">
						<input type="text" id="color1" value="fff">
					</div>
				</div>
				<div class="form-group">
					<label for="color2">Color 2 (accent)</label>
					<div class="color-row">
						<input type="color" id="color2picker" value="#c6a15b">
						<input type="text" id="color2" value="c6a15b">
					</div>
				</div>
			</div>
			<div class="hint">Hex values without "#" -- matches lower.js's color1/color2 URL parameters.</div>

			<button class="btn-show" id="showBtn">Show</button>
			<div class="status" id="status"></div>
		</div>
	</div>

	<script>
		const CHANNEL_NAME = 'infor-r-lower-thirds';
		const channel = new BroadcastChannel(CHANNEL_NAME);

		const line1El = document.getElementById('line1');
		const line2El = document.getElementById('line2');
		const color1El = document.getElementById('color1');
		const color2El = document.getElementById('color2');
		const color1PickerEl = document.getElementById('color1picker');
		const color2PickerEl = document.getElementById('color2picker');
		const statusEl = document.getElementById('status');

		// Keep the hex text input and the native color picker in sync in both directions.
		function syncPickerToText(picker, text) {
			picker.addEventListener('input', () => {
				text.value = picker.value.replace('#', '');
			});
		}
		function syncTextToPicker(text, picker) {
			text.addEventListener('input', () => {
				const hex = text.value.replace('#', '').trim();
				if (/^[0-9a-fA-F]{6}$/.test(hex)) {
					picker.value = '#' + hex;
				}
			});
		}
		syncPickerToText(color1PickerEl, color1El);
		syncPickerToText(color2PickerEl, color2El);
		syncTextToPicker(color1El, color1PickerEl);
		syncTextToPicker(color2El, color2PickerEl);

		function sanitizeHex(value, fallback) {
			const hex = (value || '').replace('#', '').trim();
			return /^[0-9a-fA-F]{6}$/.test(hex) ? hex : fallback;
		}

		// localStorage key used as a fallback handoff channel -- see the big comment
		// block below the BroadcastChannel line at the top of this script for why
		// this exists alongside BroadcastChannel rather than replacing it.
		const STORAGE_KEY = 'infor-r-lower-thirds-state';

		document.getElementById('showBtn').addEventListener('click', () => {
			const templateEl = document.querySelector('input[name="template"]:checked');
			const data = {
				id: templateEl ? templateEl.value : '1',
				line1: line1El.value,
				line2: line2El.value,
				color1: sanitizeHex(color1El.value, 'fff'),
				color2: sanitizeHex(color2El.value, 'c6a15b'),
				_t: Date.now() // lets result.html tell two identical presses apart
			};

			// Primary channel: works when panel.html and result.html are both Browser
			// Sources/Interact windows inside the SAME OBS scene-source CEF context
			// (the originally-documented "Control scene + Interact" setup).
			channel.postMessage(data);

			// Fallback channel: BroadcastChannel does NOT cross from a Custom Browser
			// DOCK (View/Docks -> Custom Browser Docks) to a scene's Browser Source,
			// even though both are "inside OBS" -- confirmed live: dock UI works fine,
			// but Show never reached result.html. Docks appear to run in a separate
			// CEF request context from scene sources, so BroadcastChannel/localStorage
			// under file:// don't share state across that boundary either.
			//
			// localStorage works here ONLY if this page is loaded over http://, not
			// file:// (both need the same origin, and file:// origins don't share
			// storage the way a real host:port does) -- see LOCAL-SETUP.md, "Custom
			// Browser Dock setup" for how to serve this folder over http:// for that
			// reason. Writing is a no-op error under file:// in most engines, so this
			// is wrapped defensively rather than assumed to always succeed.
			try {
				localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
			} catch (e) {
				// file:// origin, or storage disabled -- BroadcastChannel-only is fine
				// for the Interact-based setup, so this is silently ignored.
			}

			statusEl.textContent = 'Sent to result.html at ' + new Date().toLocaleTimeString();
			setTimeout(() => { statusEl.textContent = ''; }, 4000);
		});
	</script>
</body>
</html>
