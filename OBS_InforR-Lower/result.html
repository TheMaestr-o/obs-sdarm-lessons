<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<title>Lower Third Result</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			/* True transparency: native/overlay.html (loaded in the iframe below) is
			   transparent too, so nothing on this page needs a black backdrop for a
			   Chroma Key filter to key out anymore -- add this file directly as an
			   OBS Browser Source with no Chroma Key filter required. */
			background: transparent;
			overflow: hidden;
		}
		#waiting {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #666;
			font-family: sans-serif;
			font-size: 1.2em;
			text-align: center;
			padding: 1em;
			box-sizing: border-box;
		}

		/* #waiting's own `display:flex` (an ID rule) otherwise outranks the browser's
		   default `[hidden]{display:none}` (an attribute rule), so the `hidden`
		   property set from script would silently fail to hide it without this. */
		#waiting[hidden] {
			display: none;
		}

		/*
		Bottom-anchor strip: native/overlay.html now bottom-anchors ITSELF
		(position:fixed;left:0;bottom:0 on its own #overlay-root -- see that file),
		so this iframe no longer needs to be short purely as a CSS trick. It's kept
		short anyway (same 220px as before) simply because that's the intended
		lower-third size on the 1920x1080 canvas -- see native/overlay.html's own
		comment for the height reasoning, unchanged from the original derivation.
		*/
		#overlayFrame {
			position: fixed;
			left: 0;
			bottom: 0;
			width: 100%;
			height: 220px;
			border: 0;
			display: block;
			background: transparent;
		}

		/* Same specificity issue as #waiting above: this ID rule's `display:block`
		   would otherwise outrank the browser's default `[hidden]{display:none}`. */
		#overlayFrame[hidden] {
			display: none;
		}
	</style>
</head>
<body>
	<!--
	This page is a thin wrapper around native/overlay.html (OUR OWN code -- see
	LOCAL-SETUP.md, "Option C"). It does not render the lower third itself: it
	listens on a BroadcastChannel for new data sent from panel.html and points an
	<iframe> at native/overlay.html with the new parameters.

	Earlier versions of this file pointed at the third-party lower.html and, after
	loading it, reached INTO the iframe's contentDocument to pause its
	animation mid-hold (freezing it before its built-in reverse phase could play).
	That approach could not work: Chromium enforces same-origin restrictions
	between file:// documents strictly enough that a parent file:// page cannot
	read another file:// iframe's contentDocument, even though both report the
	same "file://" origin -- confirmed from inside this page's own script, not
	just from an external test harness. Since OBS's Browser Source is Chromium
	(CEF) too, that failure mode is real in actual OBS use, not just local testing.

	native/overlay.html sidesteps the problem entirely: its CSS animations are our
	own, written to run their "appear" phase once and then hold forever
	(`animation-fill-mode: forwards`, no `alternate`, no auto-reverse) -- so there
	is nothing left to freeze, and no need to reach into the iframe at all. This
	page only ever WRITES the iframe's `src`; it never reads anything back out of
	it. See native/overlay.css and native/overlay.html for the implementation, and
	LOCAL-SETUP.md for the full writeup.

	Add THIS file (result.html) as the OBS Browser Source at the full canvas size
	(e.g. 1920x1080), not native/overlay.html directly, and keep panel.html open in
	a separate window/tab to control it.
	-->
	<div id="waiting">Waiting for panel.html&hellip;<br>Open panel.html in another window, fill in the question, and press Show.</div>
	<iframe id="overlayFrame" title="Lower third overlay" hidden></iframe>

	<script>
		const CHANNEL_NAME = 'infor-r-lower-thirds';
		const channel = new BroadcastChannel(CHANNEL_NAME);

		const waitingEl = document.getElementById('waiting');
		const frameEl = document.getElementById('overlayFrame');

		channel.onmessage = function (event) {
			const data = event.data || {};

			const params = new URLSearchParams();
			params.set('id', data.id || '1');
			params.set('line1', data.line1 || '');
			params.set('line2', data.line2 || '');
			if (data.color1) params.set('color1', data.color1);
			if (data.color2) params.set('color2', data.color2);
			// Cache-bust so pressing "Show" twice with identical text still forces the
			// iframe to reload: setting .src to a string identical to its current
			// value is a no-op in every browser, and native/overlay.html currently
			// reads its render() parameters from the URL once at load.
			params.set('_t', Date.now().toString());

			// Reset the iframe's src on every message so native/overlay.html's
			// render() always runs again with the new text -- this replaces whatever
			// was showing (including a still-held, previously-"forwards"-completed
			// animation) with the new question, satisfying both halves of the
			// requirement: the overlay holds indefinitely on its own, AND changes
			// cleanly the moment the presenter presses Show again.
			frameEl.src = 'native/overlay.html?' + params.toString();
			frameEl.hidden = false;
			waitingEl.hidden = true;
		};
	</script>
</body>
</html>
